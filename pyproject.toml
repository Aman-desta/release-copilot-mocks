[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-copilot-mocks"
version = "0.1.0"
description = "Mock Jira, GitHub, Azure, SonarQube, ServiceNow and Teams/Slack APIs with scenarios and fault injection, for Release Copilot."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
